      <text x="18" y="92" font-family="'Sora','Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#2f0e5a" opacity="0.82">documents/year recovered</text>
